# Docker 日志轮转公共配置(防止日志无限增长撑满磁盘)
# 每个容器最多保留 10 个日志文件,每个 50MB
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcquant-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "work_mem=2MB", "-c", "random_page_cost=1.1"]
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcquant}
      POSTGRES_DB: ${POSTGRES_DB:-dcquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcquant}"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 512m
    memswap_limit: 512m
  redis:
    image: redis:7-alpine
    container_name: dcquant-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 192m
    memswap_limit: 192m
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dcquant-backend
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # bind mount 应用代码和迁移文件,修改宿主文件后 recreate/restart 即可生效
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

    mem_limit: 768m
    memswap_limit: 768m
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dcquant-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"

    mem_limit: 256m
    memswap_limit: 256m
volumes:
  pgdata:
  redisdata:
