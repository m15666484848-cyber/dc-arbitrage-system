# Docker 日志轮转公共配置(防止日志无限增长撑满磁盘)
# 每个容器最多保留 10 个日志文件,每个 50MB
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "10"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dcquant-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=192MB", "-c", "work_mem=2MB", "-c", "random_page_cost=1.1", "-c", "statement_timeout=30000"]
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dcquant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dcquant}
      POSTGRES_DB: ${POSTGRES_DB:-dcquant}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dcquant}"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 512m
    memswap_limit: 512m
    cpus: 0.5
  redis:
    image: redis:7-alpine
    container_name: dcquant-redis
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    mem_limit: 192m
    memswap_limit: 192m
    cpus: 0.25
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dcquant-backend
    restart: unless-stopped
    logging: *default-logging
    env_file: .env
    environment:
      - NATIVE_STOP_LOSS_ENABLED=${NATIVE_STOP_LOSS_ENABLED:-true}
      - PRICE_FEED_MODE=${PRICE_FEED_MODE:-websocket}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # bind mount 应用代码和迁移文件,修改宿主文件后 recreate/restart 即可生效
      - ./backend/app:/app/app
      - ./backend/scripts:/app/scripts
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/tests:/app/tests
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      # ★ Fix(2026-08-25): 5s→10s。uvicorn 单进程事件循环偶发瞬时阻塞(GC/慢请求)
      # 会造成单分钟级误报 unhealthy(8-22 曾连报19分钟);10s 容忍瞬时抖动,
      # 真实宕机仍会在 15s*10 次内被判出。
      timeout: 10s
      retries: 5
      start_period: 30s

    mem_limit: 768m
    memswap_limit: 768m
    cpus: 1.0
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dcquant-frontend
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"

    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.25
volumes:
  pgdata:
  redisdata:
